[project]
name = "evidenceflow"
version = "0.2.0"
description = "Procurement evidence review with a hands-on MCP lab"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi>=25,<26",
    "boto3>=1.40,<2",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.16,<3",
    "mcp==2.3.0",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
    "uvicorn>=0.37,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "pip-audit>=2.9,<3", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
